<style>
  :root {
    --bg: #fdfcf9;
    --ink: #2b2b2b;
    --muted: #9a958a;
    --grid-line: #e8e4da;
    --workout: #ffd8a8;
    --reading: #a8d8ea;
    --flute: #e3b8f0;
    --sketching: #ffe08a;
    --skill: #b8e6c9;
    --content: #ffb3ba;
    --phd: #c9c9ff;
    --nojunk: #f4a49a;

    --habit-col-w: 150px;
    --day-col-w: 32px;
    --count-col-w: 64px;

    --mt-bg: #2c2e31;
    --mt-sub: #646669;
    --mt-text: #d1d0c5;
    --mt-accent: #e2b714;
    --mt-avg: #7e8082;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    padding: 28px 32px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 6px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 10px;
  }
  h1 {
    font-size: 26px;
    margin: 0;
    letter-spacing: 1px;
    font-weight: 700;
    text-transform: uppercase;
  }
  h1 .thin {
    font-style: italic;
    font-weight: 400;
    text-transform: none;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    flex-wrap: wrap;
  }
  .stopwatch-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .stopwatch-btn:hover { background: #1a1a1a; }
  .thoughts-link {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .thoughts-link:hover { background: var(--ink); color: #fff; }
  .download-btn {
    background: var(--mt-accent, #e2b714);
    color: #2c2e31;
    font-weight: 700;
  }
  .download-btn:hover { background: #cba310; }

  .back-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    margin-top: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .back-link:hover { color: var(--ink); }

  .thoughts-heading {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 24px;
    margin: 10px 0 18px 0;
    color: var(--ink);
  }

  .thought-input-card {
    background: var(--card-bg, #fff);
    border: 1px solid var(--grid-line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 22px;
  }
  .thought-input-card textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: vertical;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    min-height: 80px;
  }
  .thought-input-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--grid-line);
  }
  .thought-word-count {
    font-size: 11.5px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .thought-word-count.over-limit { color: #e0645a; font-weight: 700; }
  .thought-add-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 7px 18px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .thought-add-btn:hover { background: #1a1a1a; }
  .thought-add-btn:disabled { background: #c9c5ba; cursor: not-allowed; }

  .thoughts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 30px;
  }
  .thought-card {
    background: var(--card-bg, #fff);
    border: 1px solid var(--grid-line);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .thought-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .thought-timestamp {
    font-size: 11px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .thought-text {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .thought-actions {
    display: flex;
    gap: 6px;
    flex: none;
  }
  .thought-action-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .thought-action-btn:hover { color: var(--ink); text-decoration: underline; }
  .thought-action-btn.delete-action:hover { color: #e0645a; }
  .thought-edit-textarea {
    width: 100%;
    border: 1px solid var(--grid-line);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: var(--ink);
    resize: vertical;
    min-height: 70px;
    margin-top: 4px;
  }
  .thought-edit-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .thought-edit-save {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .thought-edit-save:disabled { background: #c9c5ba; cursor: not-allowed; }
  .thought-edit-cancel {
    background: none;
    border: 1px solid var(--grid-line);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin-right: 8px;
  }
  .thoughts-empty {
    color: var(--muted);
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 20px 0;
  }
  .stopwatch-panel {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    z-index: 30;
    width: 250px;
    background: var(--mt-bg);
    color: #f2f2f0;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .stopwatch-panel.open { display: block; }
  .stopwatch-panel .sw-label {
    font-size: 10.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--mt-sub);
    margin-bottom: 4px;
  }
  .stopwatch-panel select,
  .stopwatch-panel input[type="number"] {
    width: 100%;
    padding: 7px 8px;
    border-radius: 7px;
    border: 1px solid #4a4c50;
    background: #202226;
    color: #f2f2f0;
    font-size: 13px;
    margin-bottom: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .stopwatch-panel .sw-display {
    font-family: 'Courier New', monospace;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 1px;
    color: var(--mt-accent);
    margin-bottom: 12px;
  }
  .stopwatch-panel .sw-buttons {
    display: flex;
    gap: 8px;
  }
  .stopwatch-panel .sw-buttons button {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .stopwatch-panel .sw-start { background: var(--mt-accent); color: #2c2e31; }
  .stopwatch-panel .sw-pause { background: #4a4c50; color: #fff; }
  .stopwatch-panel .sw-reset { background: transparent; color: var(--mt-sub); border: 1px solid #4a4c50 !important; }
  .stopwatch-panel .sw-note {
    margin-top: 10px;
    font-size: 10.5px;
    color: var(--mt-sub);
    line-height: 1.4;
  }
  .month-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .month-controls button {
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .month-controls button:hover { background: var(--ink); color: #fff; }
  .month-label {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    min-width: 130px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Shared scroll container for graph + table so columns align perfectly */
  .aligned-wrap {
    overflow-x: auto;
    margin-top: 14px;
    border-radius: 14px;
  }
  .aligned-inner {
    min-width: calc(var(--habit-col-w) + 31 * var(--day-col-w));
  }

  /* Monkeytype-style graph */
  .graph-card {
    background: var(--mt-bg);
    border-radius: 10px 10px 0 0;
    padding: 14px 0 4px 0;
    position: relative;
  }
  .graph-success {
    position: absolute;
    top: 30px;
    bottom: 8px;
    left: 10px;
    width: 128px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .graph-success .sr-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: #ff9d94;
    font-weight: 700;
    text-transform: uppercase;
  }
  .graph-success .sr-value {
    font-size: 36px;
    font-weight: 800;
    color: #fff;
    line-height: 1.05;
  }
  .graph-success .sr-hearts { font-size: 16px; }
  .graph-success .sr-msg {
    font-size: 11px;
    letter-spacing: 0.5px;
    color: #ff9d94;
    font-weight: 700;
  }
  .graph-legend {
    display: flex;
    gap: 16px;
    padding: 0 16px 8px calc(var(--habit-col-w) + 4px);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--mt-text);
  }
  .graph-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .graph-legend .swatch { width: 12px; height: 2px; display: inline-block; }
  .graph-legend .swatch.dashed { border-top: 1px dashed var(--mt-avg); background: none; height: 0; }

  /* Table */
  table {
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    text-align: center;
    padding: 0;
    border: 1px solid var(--grid-line);
  }
  thead th {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    padding: 6px 0;
    width: var(--day-col-w);
    border-top: none;
    background: var(--bg);
  }
  thead th.today {
    color: #fff;
    background: var(--ink);
    border-radius: 3px 3px 0 0;
  }
  .habit-col {
    text-align: left !important;
    padding: 9px 14px !important;
    width: var(--habit-col-w);
    font-size: 14px;
    font-style: italic;
    white-space: nowrap;
    border-left: none;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
  }
  .count-col {
    width: var(--count-col-w);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
  }
  th.count-col {
    font-weight: 600;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cell-btn {
    width: 100%;
    height: 26px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: block;
    padding: 0;
  }
  .cell-btn.done {
    filter: saturate(1.15);
  }
  .cell-btn:hover:not(.done) {
    background: #f1efe8;
  }

  .footer-note {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<div class="top-bar">
  <div class="title-group">
    <h1>Habit <span class="thin">Tracker</span></h1>
    <button id="stopwatchToggle" class="stopwatch-btn">⏱ Timer</button>
    <div id="stopwatchPanel" class="stopwatch-panel">
      <div class="sw-label">Choose habit</div>
      <select id="swHabitSelect"></select>
      <div class="sw-label">Duration (minutes)</div>
      <input type="number" id="swDurationInput" min="1" max="240" value="25" />
      <div class="sw-display" id="swDisplay">25:00</div>
      <div class="sw-buttons">
        <button class="sw-start" id="swStartBtn">Start</button>
        <button class="sw-pause" id="swPauseBtn">Pause</button>
        <button class="sw-reset" id="swResetBtn">Reset</button>
      </div>
      <div class="sw-note" id="swNote">Starting the timer marks this habit done for today.</div>
    </div>
    <button id="thoughtsToggle" class="stopwatch-btn thoughts-link">📝 Thoughts</button>
    <button id="downloadReportBtn" class="stopwatch-btn download-btn">⬇ Report</button>
  </div>
  <div class="month-controls" id="monthControls">
    <button id="prevMonth">&larr;</button>
    <div class="month-label" id="monthLabel">MONTH</div>
    <button id="nextMonth">&rarr;</button>
  </div>
</div>

<div id="mainView">
  <div class="aligned-wrap" style="margin-top:16px;">
    <div class="aligned-inner">
      <div class="graph-card">
        <div class="graph-legend">
          <span><span class="swatch" style="background:var(--mt-accent)"></span>Daily habits done</span>
          <span><span class="swatch dashed"></span>Average</span>
        </div>
        <svg id="progressSvg" width="100%" height="150" style="display:block;"></svg>
        <div class="graph-success">
          <div class="sr-label">Success Rate</div>
          <div class="sr-value" id="srValue">0%</div>
          <div class="sr-hearts" id="srHearts"></div>
          <div class="sr-msg" id="srMsg">Keep going</div>
        </div>
      </div>

      <table id="trackerTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="bodyRows"></tbody>
      </table>
    </div>
  </div>

  <div class="footer-note" id="loadingNote">Loading saved progress...</div>
</div>

<div id="thoughtsView" style="display:none;">
  <button id="thoughtsBack" class="back-link">&larr; Back to Habit Tracker</button>
  <h2 class="thoughts-heading">Thoughts</h2>

  <div class="thought-input-card">
    <textarea id="thoughtInput" placeholder="What's on your mind today? (max 250 words)" rows="4"></textarea>
    <div class="thought-input-row">
      <span class="thought-word-count" id="thoughtWordCount">0 / 250 words</span>
      <button id="thoughtAddBtn" class="thought-add-btn">Add</button>
    </div>
  </div>

  <div id="thoughtsList" class="thoughts-list"></div>
</div>

<script>
const HABITS = [
  { key: "workout", label: "Workout", color: "var(--workout)" },
  { key: "reading", label: "Reading", color: "var(--reading)" },
  { key: "flute", label: "Flute", color: "var(--flute)" },
  { key: "sketching", label: "Sketching", color: "var(--sketching)" },
  { key: "skill", label: "Skill", color: "var(--skill)" },
  { key: "content", label: "Content Creation", color: "var(--content)" },
  { key: "phd", label: "PhD Work", color: "var(--phd)" },
  { key: "nojunk", label: "No Junk Food", color: "var(--nojunk)" },
];

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const HABIT_COL_PX = 150;
const COUNT_COL_PX = 64;
const MIN_DAY_COL_PX = 30;
const MAX_DAY_COL_PX = 50;
let DAY_COL_PX = 32;

let viewYear, viewMonth;
let data = {};

function computeDayColPx(numDays) {
  const wrap = document.querySelector('.aligned-wrap');
  const available = (wrap ? wrap.clientWidth : 900) - HABIT_COL_PX - COUNT_COL_PX;
  let w = Math.floor(available / numDays);
  if (w < MIN_DAY_COL_PX) w = MIN_DAY_COL_PX;
  if (w > MAX_DAY_COL_PX) w = MAX_DAY_COL_PX;
  return w;
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtDate(y, m, d) { return y + "-" + pad(m+1) + "-" + pad(d); }
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function isTodayDate(y, m, d) {
  const t = new Date();
  return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
}

const LS_KEY = 'habit-tracker-data-v1';
const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage !== null;

async function loadData() {
  if (hasClaudeStorage) {
    try {
      const result = await window.storage.get('habit-tracker-data', false);
      if (result && result.value) { data = JSON.parse(result.value); return; }
    } catch (e) { /* fall through to localStorage */ }
  }
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) { data = {}; }
}

async function saveData() {
  if (hasClaudeStorage) {
    try {
      await window.storage.set('habit-tracker-data', JSON.stringify(data), false);
      return;
    } catch (e) { /* fall through to localStorage */ }
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch (e) { console.error('Failed to save', e); }
}

function toggleCell(habitKey, dateStr) {
  const cellKey = habitKey + ":" + dateStr;
  if (data[cellKey]) delete data[cellKey];
  else data[cellKey] = true;
  saveData();
  render();
}

function computeStreak(habitKey) {
  let streak = 0;
  let d = new Date();
  d.setHours(0,0,0,0);
  while (true) {
    const key = habitKey + ":" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
    if (!data[key]) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function smoothPath(points) {
  if (points.length < 2) return "";
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i === 0 ? 0 : i - 1];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}

function renderGraph(numDays) {
  const dayCounts = [];
  for (let d = 1; d <= numDays; d++) {
    let c = 0;
    HABITS.forEach(h => { if (data[h.key + ":" + fmtDate(viewYear, viewMonth, d)]) c++; });
    dayCounts.push(c);
  }
  const maxVal = HABITS.length;

  const today = new Date();
  const isCurrentMonth = today.getFullYear() === viewYear && today.getMonth() === viewMonth;
  const daysToCount = isCurrentMonth ? today.getDate() : numDays;
  let completedSum = 0;
  for (let d = 0; d < daysToCount; d++) completedSum += dayCounts[d];
  const possible = daysToCount * maxVal;
  const successRate = possible > 0 ? Math.round((completedSum / possible) * 100) : 0;
  const average = daysToCount > 0 ? completedSum / daysToCount : 0;

  document.getElementById("srValue").textContent = successRate + "%";
  let hearts = "", msg = "Keep going";
  if (successRate >= 80) { hearts = "❤️❤️"; msg = "Good job"; }
  else if (successRate >= 50) { hearts = "❤️"; msg = "Nice work"; }
  else if (successRate > 0) { hearts = "🤍"; msg = "Keep going"; }
  else { hearts = "🤍"; msg = "Get started"; }
  document.getElementById("srHearts").textContent = hearts;
  document.getElementById("srMsg").textContent = msg;

  const svg = document.getElementById("progressSvg");
  const width = HABIT_COL_PX + numDays * DAY_COL_PX;
  const height = 150;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.innerHTML = "";

  const ns = "http://www.w3.org/2000/svg";
  const padTop = 18, padBottom = 14;
  const plotLeft = HABIT_COL_PX;
  const usableH = height - padTop - padBottom;

  const bgRect = document.createElementNS(ns, "rect");
  bgRect.setAttribute("x", 0);
  bgRect.setAttribute("y", 0);
  bgRect.setAttribute("width", width);
  bgRect.setAttribute("height", height);
  bgRect.setAttribute("fill", "var(--mt-bg)");
  svg.appendChild(bgRect);

  for (let v = 0; v <= maxVal; v++) {
    const y = padTop + usableH - (v / maxVal) * usableH;
    const line = document.createElementNS(ns, "line");
    line.setAttribute("x1", plotLeft);
    line.setAttribute("x2", width - 4);
    line.setAttribute("y1", y);
    line.setAttribute("y2", y);
    line.setAttribute("stroke", "#3d3f43");
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);

    const label = document.createElementNS(ns, "text");
    label.setAttribute("x", plotLeft - 8);
    label.setAttribute("y", y + 3);
    label.setAttribute("text-anchor", "end");
    label.setAttribute("font-size", "9");
    label.setAttribute("font-family", "'Courier New', monospace");
    label.setAttribute("fill", "var(--mt-sub)");
    label.textContent = v;
    svg.appendChild(label);
  }

  const points = dayCounts.map((val, i) => {
    const x = plotLeft + DAY_COL_PX * i + DAY_COL_PX / 2;
    const y = padTop + usableH - (val / maxVal) * usableH;
    return { x, y, val };
  });

  const defs = document.createElementNS(ns, "defs");
  defs.innerHTML = `
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>`;
  svg.appendChild(defs);

  const avgY = padTop + usableH - (average / maxVal) * usableH;
  const avgLine = document.createElementNS(ns, "line");
  avgLine.setAttribute("x1", plotLeft);
  avgLine.setAttribute("x2", width - 4);
  avgLine.setAttribute("y1", avgY);
  avgLine.setAttribute("y2", avgY);
  avgLine.setAttribute("stroke", "var(--mt-avg)");
  avgLine.setAttribute("stroke-width", "1.5");
  avgLine.setAttribute("stroke-dasharray", "4 3");
  svg.appendChild(avgLine);

  const avgLabel = document.createElementNS(ns, "text");
  avgLabel.setAttribute("x", width - 6);
  avgLabel.setAttribute("y", avgY - 5);
  avgLabel.setAttribute("text-anchor", "end");
  avgLabel.setAttribute("font-size", "9.5");
  avgLabel.setAttribute("font-family", "'Courier New', monospace");
  avgLabel.setAttribute("fill", "var(--mt-avg)");
  avgLabel.textContent = "avg " + average.toFixed(1);
  svg.appendChild(avgLabel);

  const activeCount = isCurrentMonth ? daysToCount : numDays;
  const activePoints = points.slice(0, activeCount);

  if (activePoints.length >= 2) {
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", smoothPath(activePoints));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "var(--mt-accent)");
    path.setAttribute("stroke-width", "2.2");
    path.setAttribute("filter", "url(#glow)");
    svg.appendChild(path);
  }

  activePoints.forEach((p, i) => {
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", p.x);
    dot.setAttribute("cy", p.y);
    dot.setAttribute("r", i === activePoints.length - 1 ? 3.2 : 2);
    dot.setAttribute("fill", "var(--mt-accent)");
    svg.appendChild(dot);
  });

  for (let i = activeCount; i < points.length; i++) {
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", points[i].x);
    dot.setAttribute("cy", padTop + usableH);
    dot.setAttribute("r", 1.3);
    dot.setAttribute("fill", "#4a4c50");
    svg.appendChild(dot);
  }
}

function fmtSwTime(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const pad2 = n => n < 10 ? "0" + n : "" + n;
  return h > 0 ? `${pad2(h)}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}

  document.getElementById("swDisplay").textContent = fmtSwTime(swRemaining);
}

let swAudioCtx = null;

function playAlertSound() {
  try {
    if (!swAudioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      swAudioCtx = new AudioCtx();
    }
    const ctx = swAudioCtx;
    const now = ctx.currentTime;
    // Three short beeps
    [0, 0.35, 0.7].forEach(offset => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.3);
    });
  } catch (e) { /* audio not available, fail silently */ }
}

document.getElementById("swDurationInput").addEventListener("input", () => {
  if (swRunning) return;
  swRemaining = getSwDurationSeconds();
  updateSwDisplay();
});

document.getElementById("swStartBtn").addEventListener("click", () => {
  if (swRunning) return;
  if (!swAudioCtx) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      swAudioCtx = new AudioCtx();
    } catch (e) { /* ignore */ }
  } else if (swAudioCtx.state === "suspended") {
    swAudioCtx.resume();
  }
  if (swRemaining <= 0) swRemaining = getSwDurationSeconds();
  swRunning = true;
  document.getElementById("swHabitSelect").disabled = true;
  document.getElementById("swDurationInput").disabled = true;
  document.getElementById("swNote").textContent = "Starting the timer marks this habit done for today.";
  const habitKey = document.getElementById("swHabitSelect").value;
  tickHabitToday(habitKey);
  swIntervalId = setInterval(() => {
    swRemaining--;
    updateSwDisplay();
    if (swRemaining <= 0) {
      clearInterval(swIntervalId);
      swRunning = false;
      document.getElementById("swHabitSelect").disabled = false;
      document.getElementById("swDurationInput").disabled = false;
      document.getElementById("swNote").textContent = "Time's up! Great work.";
      playAlertSound();
    }
  }, 1000);
});
document.getElementById("swPauseBtn").addEventListener("click", () => {
  swRunning = false;
  clearInterval(swIntervalId);
  document.getElementById("swHabitSelect").disabled = false;
  document.getElementById("swDurationInput").disabled = false;
});
document.getElementById("swResetBtn").addEventListener("click", () => {
  swRunning = false;
  clearInterval(swIntervalId);
  swRemaining = getSwDurationSeconds();
  updateSwDisplay();
  document.getElementById("swHabitSelect").disabled = false;
  document.getElementById("swDurationInput").disabled = false;
  document.getElementById("swNote").textContent = "Starting the timer marks this habit done for today.";
});

const THOUGHTS_KEY = 'habit-tracker-thoughts';
const THOUGHTS_LS_KEY = 'habit-tracker-thoughts-v1';
const MAX_THOUGHT_WORDS = 250;
let thoughts = [];

async function loadThoughts() {
  if (hasClaudeStorage) {
    try {
      const result = await window.storage.get(THOUGHTS_KEY, false);
      if (result && result.value) { thoughts = JSON.parse(result.value); return; }

    if (raw) thoughts = JSON.parse(raw);
  } catch (e) { thoughts = []; }
}

async function saveThoughts() {

    try {
      await window.storage.set(THOUGHTS_KEY, JSON.stringify(thoughts), false);
      return;
    } catch (e) { /* fall through */ }

function countWords(text) {
  const trimmed = text.trim();
  if (!trimmed) return 0;
  return trimmed.split(/\s+/).length;
}

function fmtThoughtTimestamp(date) {
  const dd = pad(date.getDate());
  const mm = pad(date.getMonth() + 1);
  const yyyy = date.getFullYear();
  const hh = pad(date.getHours());
  const min = pad(date.getMinutes());
  const ss = pad(date.getSeconds());
  return `${dd}/${mm}/${yyyy}-${hh}:${min}:${ss}`;
}

let editingThoughtIndex = null;

function renderThoughts() {
  const list = document.getElementById("thoughtsList");
  list.innerHTML = "";
  if (thoughts.length === 0) {
    const empty = document.createElement("div");
    empty.className = "thoughts-empty";
    empty.textContent = "No thoughts added yet. Write your first one above.";
    list.appendChild(empty);
    return;
  }
  for (let i = thoughts.length - 1; i >= 0; i--) {
    const t = thoughts[i];
    const card = document.createElement("div");
    card.className = "thought-card";

    if (editingThoughtIndex === i) {
      const ts = document.createElement("div");
      ts.className = "thought-timestamp";
      ts.textContent = t.timestamp;
      card.appendChild(ts);

      const editArea = document.createElement("textarea");
      editArea.className = "thought-edit-textarea";
      editArea.value = t.text;
      card.appendChild(editArea);

      const editRow = document.createElement("div");
      editRow.className = "thought-edit-row";

      const wordCount = document.createElement("span");
      wordCount.className = "thought-word-count";
      wordCount.textContent = `${countWords(t.text)} / ${MAX_THOUGHT_WORDS} words`;

      const btnGroup = document.createElement("div");
      const cancelBtn = document.createElement("button");
      cancelBtn.className = "thought-edit-cancel";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", () => {
        editingThoughtIndex = null;
        renderThoughts();
      });
      const saveBtn = document.createElement("button");
      saveBtn.className = "thought-edit-save";
      saveBtn.textContent = "Save";

      editArea.addEventListener("input", () => {
        const words = countWords(editArea.value);
        wordCount.textContent = `${words} / ${MAX_THOUGHT_WORDS} words`;
        if (words > MAX_THOUGHT_WORDS) {
          wordCount.classList.add("over-limit");
          saveBtn.disabled = true;
        } else {
          wordCount.classList.remove("over-limit");
          saveBtn.disabled = false;
        }
      });

      saveBtn.addEventListener("click", async () => {
        const newText = editArea.value.trim();
        if (!newText || countWords(newText) > MAX_THOUGHT_WORDS) return;
        thoughts[i].text = newText;
        await saveThoughts();
        editingThoughtIndex = null;
        renderThoughts();
      });

      btnGroup.appendChild(cancelBtn);
      btnGroup.appendChild(saveBtn);
      editRow.appendChild(wordCount);
      editRow.appendChild(btnGroup);
      card.appendChild(editRow);

    } else {
      const topRow = document.createElement("div");
      topRow.className = "thought-top-row";

      const ts = document.createElement("div");
      ts.className = "thought-timestamp";
      ts.textContent = t.timestamp;

      const actions = document.createElement("div");
      actions.className = "thought-actions";
      const editBtn = document.createElement("button");
      editBtn.className = "thought-action-btn edit-action";
      editBtn.textContent = "Edit";
      editBtn.addEventListener("click", () => {
        editingThoughtIndex = i;
        renderThoughts();
      });
      const deleteBtn = document.createElement("button");
      deleteBtn.className = "thought-action-btn delete-action";
      deleteBtn.textContent = "Delete";
      deleteBtn.addEventListener("click", async () => {
        if (confirm("Delete this thought? This cannot be undone.")) {
          thoughts.splice(i, 1);
          await saveThoughts();
          renderThoughts();
        }
      });
      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      topRow.appendChild(ts);
      topRow.appendChild(actions);

      const txt = document.createElement("div");
      txt.className = "thought-text";
      txt.textContent = t.text;

      card.appendChild(topRow);
      card.appendChild(txt);
    }

    list.appendChild(card);
  }
}

function updateThoughtWordCount() {
  const textarea = document.getElementById("thoughtInput");
  const counter = document.getElementById("thoughtWordCount");
  const addBtn = document.getElementById("thoughtAddBtn");

    counter.classList.remove("over-limit");
    addBtn.disabled = false;
  }
}

function escapeXml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

const HABIT_HEX = {
  workout: 'FFD8A8',
  reading: 'A8D8EA',
  flute: 'E3B8F0',
  sketching: 'FFE08A',
  skill: 'B8E6C9',

function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function buildGraphCanvas(dayCounts, maxVal, average) {
  const scale = 2;
  const width = 1500 * scale;
  const height = 360 * scale;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  // light cream background, matching the app
  ctx.fillStyle = '#fdfcf9';
  ctx.fillRect(0, 0, width, height);

  const marginLeft = 55 * scale;
  const marginRight = 90 * scale;
  const marginTop = 30 * scale;
  const marginBottom = 34 * scale;
  const plotW = width - marginLeft - marginRight;
  const plotH = height - marginTop - marginBottom;
  const numDays = dayCounts.length;

  // gridlines + y-axis labels
  ctx.strokeStyle = '#e8e4da';
  ctx.lineWidth = 1 * scale;
  ctx.fillStyle = '#9a958a';
  ctx.font = `${13 * scale}px Arial`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let v = 0; v <= maxVal; v++) {
    const y = marginTop + plotH - (v / maxVal) * plotH;
    ctx.beginPath();
    ctx.moveTo(marginLeft, y);
    ctx.lineTo(width - marginRight, y);
    ctx.stroke();
    ctx.fillText(String(v), marginLeft - 10 * scale, y);
  }

  const points = dayCounts.map((val, i) => {
    const x = marginLeft + (plotW / ((numDays - 1) || 1)) * i;
    const y = marginTop + plotH - (val / maxVal) * plotH;
    return { x, y, val };
  });

  function smoothPathOnCtx() {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? 0 : i - 1], p1 = points[i], p2 = points[i + 1], p3 = points[i + 2 < points.length ? i + 2 : i + 1];
      const cp1x = p1.x + (p2.x - p0.x) / 6, cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6, cp2y = p2.y - (p3.y - p1.y) / 6;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
  }

  if (points.length >= 2) {
    // light fill under the curve
    smoothPathOnCtx();
    ctx.lineTo(points[points.length - 1].x, marginTop + plotH);
    ctx.lineTo(points[0].x, marginTop + plotH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(123, 208, 196, 0.20)';
    ctx.fill();

    // the line itself, light mint/teal
    smoothPathOnCtx();
    ctx.strokeStyle = '#6fc9ba';
    ctx.lineWidth = 3 * scale;
    ctx.stroke();
  }

  // point markers
  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, (i === points.length - 1 ? 4.5 : 3) * scale, 0, Math.PI * 2);
    ctx.fillStyle = '#6fc9ba';
    ctx.fill();
  });

  // average dashed line (light amber)
  const avgY = marginTop + plotH - (average / maxVal) * plotH;
  ctx.setLineDash([7 * scale, 5 * scale]);
  ctx.strokeStyle = '#f2b632';
  ctx.lineWidth = 2 * scale;
  ctx.beginPath();
  ctx.moveTo(marginLeft, avgY);
  ctx.lineTo(width - marginRight, avgY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#c9932a';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = `${13 * scale}px Arial`;
  ctx.fillText(`avg ${average.toFixed(1)}`, width - marginRight + 8 * scale, avgY);

  // x-axis day labels
  ctx.fillStyle = '#9a958a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `${11 * scale}px Arial`;
  const labelStep = numDays > 20 ? 2 : 1;
  points.forEach((p, i) => {
    if (i % labelStep === 0) ctx.fillText(String(i + 1), p.x, marginTop + plotH + 10 * scale);
  });

  return canvas;
}

async function downloadMonthlyReport() {
  if (typeof JSZip === 'undefined') {
    alert('Report generator failed to load. Check your internet connection and try again.');
    return;
  }

  const numDays = daysInMonth(viewYear, viewMonth);
  const monthName = MONTH_NAMES[viewMonth];

  const dayCounts = [];
  for (let d = 1; d <= numDays; d++) {
    let c = 0;
    HABITS.forEach(h => { if (data[h.key + ":" + fmtDate(viewYear, viewMonth, d)]) c++; });
    dayCounts.push(c);
  }
  const maxVal = HABITS.length;
  let totalCompleted = 0;
  dayCounts.forEach(c => totalCompleted += c);
  const totalPossible = numDays * maxVal;
  const successRate = totalPossible > 0 ? Math.round((totalCompleted / totalPossible) * 100) : 0;
  const average = numDays > 0 ? (totalCompleted / numDays) : 0;

  // Build the graph image
  const graphCanvas = buildGraphCanvas(dayCounts, maxVal, average);
  const graphBlob = await canvasToBlob(graphCanvas);
  const graphArrayBuffer = await graphBlob.arrayBuffer();
  const graphPxWidth = graphCanvas.width;
  const graphPxHeight = graphCanvas.height;
  // Target print size: 9.5in wide, height scaled to preserve aspect ratio
  const graphCx = Math.round(9.5 * 914400);
  const graphCy = Math.round(graphCx * (graphPxHeight / graphPxWidth));

  // Landscape A4 usable width in twips (page 16838 wide, minus 720+720 margins)
  const labelColWidth = 1700;
  const countColWidth = 700;
  const usableWidth = 15400;
  const dayColWidth = Math.max(240, Math.floor((usableWidth - labelColWidth - countColWidth) / numDays));

  function cellXml(text, width, opts) {
    opts = opts || {};
    const bold = opts.bold ? '<w:b/>' : '';
    const align = opts.center ? '<w:jc w:val="center"/>' : '';
    const shade = opts.shade ? `<w:shd w:val="clear" w:fill="${opts.shade}"/>` : '';
    return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${shade}</w:tcPr><w:p><w:pPr>${align}</w:pPr><w:r><w:rPr>${bold}<w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r></w:p></w:tc>`;
  }

  let gridColsXml = `<w:gridCol w:w="${labelColWidth}"/>`;
  for (let d = 1; d <= numDays; d++) gridColsXml += `<w:gridCol w:w="${dayColWidth}"/>`;
  gridColsXml += `<w:gridCol w:w="${countColWidth}"/>`;

  let headerRow = '<w:tr>' + cellXml('Habit', labelColWidth, { bold: true, shade: 'EFEBE0' });
  for (let d = 1; d <= numDays; d++) headerRow += cellXml(String(d), dayColWidth, { bold: true, center: true, shade: 'EFEBE0' });
  headerRow += cellXml('Done', countColWidth, { bold: true, center: true, shade: 'EFEBE0' });
  headerRow += '</w:tr>';

  let bodyRowsXml = '';
  HABITS.forEach(h => {
    let count = 0;
    const habitHex = HABIT_HEX[h.key] || 'FFFFFF';
    let row = '<w:tr>' + cellXml(h.label, labelColWidth);
    for (let d = 1; d <= numDays; d++) {
      const done = !!data[h.key + ":" + fmtDate(viewYear, viewMonth, d)];
      if (done) count++;
      row += cellXml(done ? '\u2713' : '', dayColWidth, { center: true, shade: done ? habitHex : undefined });
    }
    row += cellXml(count + '/' + numDays, countColWidth, { center: true });
    row += '</w:tr>';
    bodyRowsXml += row;
  });

  const tableXml = `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="0" w:type="auto"/><w:tblBorders>` +
    `<w:top w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
    `<w:left w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
    `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
    `<w:right w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
    `<w:insideH w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
    `<w:insideV w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
    `</w:tblBorders></w:tblPr><w:tblGrid>${gridColsXml}</w:tblGrid>${headerRow}${bodyRowsXml}</w:tbl>`;

  // Thoughts, oldest first (storage order is already oldest -> newest), as a Date/Time | Thought table
  const thoughtDateColWidth = 2600;
  const thoughtTextColWidth = 12800;
  let thoughtsXml = '';
  if (thoughts.length === 0) {
    thoughtsXml = `<w:p><w:r><w:t>No thoughts recorded this month.</w:t></w:r></w:p>`;
  } else {
    let thoughtHeaderRow = '<w:tr>' +
      cellXml('Date & Time', thoughtDateColWidth, { bold: true, shade: 'EFEBE0' }) +
      cellXml('Thought', thoughtTextColWidth, { bold: true, shade: 'EFEBE0' }) +
      '</w:tr>';
    let thoughtBodyRows = '';
    thoughts.forEach(t => {
      thoughtBodyRows += '<w:tr>' +
        cellXml(t.timestamp, thoughtDateColWidth) +
        cellXml(t.text, thoughtTextColWidth) +
        '</w:tr>';
    });
    thoughtsXml = `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="0" w:type="auto"/><w:tblBorders>` +
      `<w:top w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
      `<w:left w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
      `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
      `<w:right w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
      `<w:insideH w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
      `<w:insideV w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>` +
      `</w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="${thoughtDateColWidth}"/><w:gridCol w:w="${thoughtTextColWidth}"/></w:tblGrid>${thoughtHeaderRow}${thoughtBodyRows}</w:tbl>`;
  }

  const graphDrawingXml = `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="200"/></w:pPr><w:r><w:drawing>
<wp:inline distT="0" distB="0" distL="0" distR="0">
<wp:extent cx="${graphCx}" cy="${graphCy}"/>
<wp:effectExtent l="0" t="0" r="0" b="0"/>
<wp:docPr id="1" name="HabitGraph"/>
<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>
<a:graphic>
<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
<pic:pic>
<pic:nvPicPr><pic:cNvPr id="0" name="HabitGraph.png"/><pic:cNvPicPr/></pic:nvPicPr>
<pic:blipFill><a:blip r:embed="rId2"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${graphCx}" cy="${graphCy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>
</pic:pic>
</a:graphicData>
</a:graphic>
</wp:inline>
</w:drawing></w:r></w:p>`;

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
<w:body>
<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="40"/></w:rPr><w:t>Productivity Report</w:t></w:r></w:p>
<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="300"/></w:pPr><w:r><w:rPr><w:sz w:val="26"/><w:color w:val="666666"/></w:rPr><w:t>${escapeXml(monthName + ' ' + viewYear)}</w:t></w:r></w:p>
<w:p><w:pPr><w:spacing w:after="200"/></w:pPr><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">Success Rate: </w:t></w:r><w:r><w:t xml:space="preserve">${successRate}%    </w:t></w:r><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">Average habits/day: </w:t></w:r><w:r><w:t xml:space="preserve">${average.toFixed(1)}    </w:t></w:r><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">Total Completed: </w:t></w:r><w:r><w:t>${totalCompleted} / ${totalPossible}</w:t></w:r></w:p>
${graphDrawingXml}
${tableXml}
<w:p><w:r><w:br w:type="page"/></w:r></w:p>
<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="300"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="36"/></w:rPr><w:t>Thoughts</w:t></w:r></w:p>
${thoughtsXml}
<w:sectPr>
<w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/>
<w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="720" w:footer="720" w:gutter="0"/>
</w:sectPr>
</w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="png" ContentType="image/png"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/>
</Relationships>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/></w:style>
<w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"/><w:basedOn w:val="TableNormal"/><w:uiPriority w:val="39"/></w:style>
</w:styles>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypesXml);
  zip.folder('_rels').file('.rels', rootRelsXml);
  const wordFolder = zip.folder('word');
  wordFolder.file('document.xml', documentXml);
  wordFolder.file('styles.xml', stylesXml);
  wordFolder.folder('_rels').file('document.xml.rels', docRelsXml);
  wordFolder.folder('media').file('image1.png', graphArrayBuffer);

  const blob = await zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Habit-Tracker-Report-${monthName}-${viewYear}.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

document.getElementById("downloadReportBtn").addEventListener("click", () => {
  downloadMonthlyReport();
});

(async function initThoughts() {
  await loadThoughts();
  renderThoughts();
})();

(async function init() {
  const today = new Date();
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  await loadData();
  render();
})();

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(), 150);
});
</script>
